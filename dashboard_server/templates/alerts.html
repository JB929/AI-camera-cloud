<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Camera Cloud – Live Alerts</title>
    <meta http-equiv="refresh" content="10"> <!-- Auto-refresh every 10 seconds -->
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f4f9;
            color: #333;
            padding: 40px;
            text-align: center;
        }
        h1 {
            color: #222;
            margin-bottom: 20px;
        }
        table {
            margin: auto;
            border-collapse: collapse;
            width: 90%;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #0078D7;
            color: white;
            text-transform: uppercase;
        }
        tr:hover {
            background: #f1f1f1;
        }
        img {
            border-radius: 8px;
            max-height: 80px;
        }
        .timestamp {
            color: #777;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>📸 AI Camera Live Alerts</h1>
    {% if alerts %}
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Camera</th>
                <th>Message</th>
                <th>Snapshot</th>
                <th>Timestamp</th>
            </tr>
        </thead>
<script>
  const socket = new WebSocket("wss://" + window.location.host + "/ws/alerts");

  socket.onmessage = function(event) {
    const data = JSON.parse(event.data);
    const alertsList = document.getElementById("alerts-list");
    const item = document.createElement("li");
    item.innerHTML = `
      <b>${data.camera_name}</b> – ${data.message} 
      <small>${data.timestamp}</small><br>
      ${data.snapshot_url ? `<img src="${data.snapshot_url}" width="200">` : ""}
    `;
    alertsList.prepend(item);
  };
</script>
        </body>
            {% for alert in alerts %}
            <tr>
                <td>{{ alert.id }}</td>
                <td>{{ alert.camera_name }}</td>
                <td>{{ alert.message }}</td>
                <td>
                    {% if alert.snapshot_path %}
                        <img src="{{ alert.snapshot_path }}" alt="snapshot">
                    {% else %}
                        —
                    {% endif %}
                </td>
                <td class="timestamp">{{ alert.timestamp }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
        <p>No alerts yet...</p>
    {% endif %}
</body>
</html>
