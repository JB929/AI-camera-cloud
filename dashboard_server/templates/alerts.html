<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Camera Alerts</title>
    <meta http-equiv="refresh" content="10"> <!-- Auto-refresh every 10 seconds -->
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            background: #0b0c10;
            color: #fff;
            font-family: 'Inter', sans-serif;
            text-align: center;
        }
        h1 {
            color: #66fcf1;
        }
        .alert-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 20px;
        }
        .alert-card {
            background: #1f2833;
            padding: 16px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 0 10px rgba(102,252,241,0.2);
        }
        img {
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
        .timestamp {
            color: #aaa;
            font-size: 0.9em;
        }
        .camera {
            color: #45a29e;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <h1>📸 Live Camera Alerts</h1>
    <p>Auto-refreshing every 10 seconds...</p>

    <div class="alert-grid">
        {% for alert in alerts %}
        <div class="alert-card">
            <p class="camera">{{ alert.camera_name }}</p>
            <p class="timestamp">{{ alert.timestamp }}</p>
            <p>{{ alert.message }}</p>
            {% if alert.snapshot_path %}
            <img src="{{ alert.snapshot_path }}" alt="Snapshot">
            {% endif %}
        </div>
        {% else %}
        <p>No alerts yet.</p>
        {% endfor %}
    </div>
</body>
</html>
