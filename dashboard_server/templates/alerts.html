<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Camera Cloud – Alerts</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0a0a0a;
            color: #eee;
            margin: 0;
            padding: 0;
        }
        table {
            width: 95%;
            margin: 40px auto;
            border-collapse: collapse;
            background: #1c1c1c;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #111;
            color: #00e5ff;
            text-transform: uppercase;
        }
        tr:hover {
            background-color: #222;
        }
        img.snapshot {
            width: 120px;
            height: auto;
            border-radius: 6px;
            transition: transform 0.2s;
        }
        img.snapshot:hover {
            transform: scale(1.2);
        }
        h1 {
            text-align: center;
            margin-top: 30px;
            color: #00e5ff;
        }
    </style>
</head>
<body>
    <h1>📸 Live Alert Log</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Camera</th>
                <th>Timestamp</th>
                <th>Message</th>
                <th>Snapshot</th>
            </tr>
        </thead>
        <tbody>
            {% for alert in alerts %}
            <tr>
                <td>{{ alert.id }}</td>
                <td>{{ alert.camera_name }}</td>
                <td>{{ alert.timestamp }}</td>
                <td>{{ alert.message }}</td>
                <td>
                    {% if alert.snapshot_url %}
                        <a href="{{ alert.snapshot_url }}" target="_blank">
                            <img src="{{ alert.snapshot_url }}" class="snapshot" alt="Snapshot">
                        </a>
                    {% else %}
                        -
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
